<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lokal ng College Day-Night Background</title>
  <style>
    html { background: #0b1026; } /* fallback while images load */

    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* Each image gets its own full-screen layer; JS sets their opacity. */
    .bg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      z-index: -1;
    }
    /* Crossfade is enabled only after the first paint, so load doesn't fade in from black */
    .ready .bg { transition: opacity 2s linear; }

    /* ---- Demo content: replace with your own ---- */
    main {
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .55);
      padding: 1rem;
    }
    #clock { font-size: clamp(3rem, 12vw, 7rem); font-weight: 600; letter-spacing: .02em; }
  </style>
</head>
<body>
  <div id="layers"></div>

  <main>
    <div>
      <!-- <div id="clock">--:--</div> -->
    </div>
  </main>

  <script>
    /* ================= CONFIG ================= */

    const IMAGES = {
      day:   "images/day.jpg",
      dusk1: "images/dusk1.jpg",   // closer to daylight
      dusk2: "images/dusk2.jpg",   // closer to night
      night: "images/night.jpg",
    };

    // 24h local time (decimal hours). Images crossfade between keyframes.
    const TIMELINE = [
      { t: 0.00,  img: "night" },
      { t: 4.50,  img: "night" },
      { t: 5.25,  img: "dusk2" },
      { t: 6.00,  img: "dusk1" },
      { t: 7.00,  img: "day"   },
      { t: 16.50, img: "day"   },
      { t: 17.50, img: "dusk1" },
      { t: 18.25, img: "dusk2" },
      { t: 19.00, img: "night" },
      { t: 24.00, img: "night" },
    ];

    const UPDATE_EVERY_MS   = 15 * 1000; // wall-clock based, so exact cadence doesn't matter
    const AUTO_RELOAD_HOURS = 6;         // soft reload to pick up replaced image files; 0 = disabled
    const IMAGE_RETRIES     = 5;

    /* ================= LOGIC ================= */

    const layersEl = document.getElementById("layers");
    const layers = {};

    // Load an image into a layer; on failure, retry with a cache-busting query.
    function loadLayer(name, attempt = 0) {
      const base = IMAGES[name];
      const url = attempt === 0 ? base : `${base}?retry=${Date.now()}`;
      const probe = new Image();
      probe.onload = () => { layers[name].style.backgroundImage = `url("${url}")`; };
      probe.onerror = () => {
        if (attempt < IMAGE_RETRIES) {
          setTimeout(() => loadLayer(name, attempt + 1), Math.min(30000, 2000 * 2 ** attempt));
        } else {
          console.error("Giving up on image:", base);
        }
      };
      probe.src = url;
    }

    for (const name of Object.keys(IMAGES)) {
      const el = document.createElement("div");
      el.className = "bg";
      layersEl.appendChild(el);
      layers[name] = el;
      loadLayer(name);
    }

    const smooth = x => x * x * (3 - 2 * x); // smoothstep easing

    function currentHour() {
      // Test any time with ?time=18.5 or ?time=18:30
      const p = new URLSearchParams(location.search).get("time");
      if (p) {
        const [h, m = 0] = p.split(":").map(Number);
        if (!isNaN(h)) return h + (m || 0) / 60;
      }
      const d = new Date();
      return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
    }

    function update() {
      const h = currentHour();

      let i = TIMELINE.findIndex((k, idx) => h >= k.t && h < TIMELINE[idx + 1]?.t);
      if (i < 0) i = TIMELINE.length - 2;
      const a = TIMELINE[i], b = TIMELINE[i + 1];
      const t = smooth((h - a.t) / (b.t - a.t));

      const opacity = { day: 0, dusk1: 0, dusk2: 0, night: 0 };
      opacity[a.img] += 1 - t;
      opacity[b.img] += t;
      for (const name in layers) layers[name].style.opacity = opacity[name];

      // Optional clock (only if #clock exists in the HTML)
      const clock = document.getElementById("clock");
      if (clock) {
        clock.textContent = new Date().toLocaleTimeString([], {
          hour: "2-digit", minute: "2-digit", second: "2-digit",
        });
      }
    }

    // One failed tick must never stop future ticks.
    function safeUpdate() {
      try { update(); } catch (err) { console.error("update failed:", err); }
    }

    // First paint without transition, then enable crossfades.
    safeUpdate();
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("ready")));

    setInterval(safeUpdate, UPDATE_EVERY_MS);

    // Re-sync immediately when the source wakes up (scene switch, OBS throttling, sleep/resume).
    document.addEventListener("visibilitychange", () => { if (!document.hidden) safeUpdate(); });
    window.addEventListener("focus", safeUpdate);
    window.addEventListener("pageshow", safeUpdate);

    // Periodic soft reload: guarantees fresh code/images eventually. Safe because
    // the page always computes the correct state from the clock on load.
    if (AUTO_RELOAD_HOURS > 0) {
      setTimeout(() => location.reload(), AUTO_RELOAD_HOURS * 3600 * 1000);
    }
  </script>
</body>
</html>
